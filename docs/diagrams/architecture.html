<h1>Arsitektur dotfiles</h1>
<p>Repo adalah sumber kebenaran. File tinggal di repo; sistem memakai symlink
dari <code>~/.config</code> dan <code>~/.local/share</code>. UWSM menyalakan
sesi, Hyprland mengatur jendela, Ax-Shell menggambar bar &amp; launcher.</p>
